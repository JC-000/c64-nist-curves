# nistcurves-example.cfg — STARTER ld65 linker config for consumers of
# c64-nist-curves (c64-lib-contract SPEC §4 / §6.1).
#
# `make lib` (and every `make lib-*` variant target) copies this file to
# build/lib/cfg/nistcurves-example.cfg alongside the archive and the
# build/lib/nistcurves.inc header. Copy it into your own project and adapt
# the MEMORY map; the SEGMENTS{} block is the part you must keep.
#
# THIS IS NOT src/c64.cfg. src/c64.cfg is the library's OWN PRG linker
# script — it also places src/main.s (the test/bench driver, in no consumer
# archive) and src/data_test.s (harness scratch), and it hard-codes a
# $0801..$CFFF map. This file is the consumer-facing subset, with the
# library's placement obligations restated so they travel with the thing
# you copy.
#
# ---------------------------------------------------------------------------
# WHY THE COMMENTS ON THE SEGMENT LINES ARE NORMATIVE (SPEC §4)
# ---------------------------------------------------------------------------
# A clean link is NOT evidence that you placed these correctly. Measured on
# ld65 V2.18, both of the diagnostics you might expect are conditional on
# the LIBRARY's shape, not on your mistake:
#
#   * `align = $100` dropped — ld65 warns only if the segment's content
#     carries a source-level `.align`. Nothing in this library's src/*.s
#     uses `.align`; the alignment is expressed ONLY in the cfg. So
#     dropping it produces NO DIAGNOSTIC AT ALL.
#   * `type = rw` flipped to `type = bss` — ld65 warns only if the
#     segment's content is non-zero. The library's scratch is zero-filled
#     `.res`, which is the normal shape, so the silent case is the common
#     one. A `bss` segment sitting ahead of a file-emitting segment makes
#     the image shorter than its address span and loads everything after
#     the hole at the wrong address. Such a build can appear to work by
#     coincidence: that exact defect shipped in this library for several
#     releases (issue #98, 53 bytes) and was benign only because the
#     trailing bytes happened to be zeros.
#
# Neither condition is one you can evaluate — both depend on library source
# you do not read. That is why the library declares them here rather than
# leaving you to infer them.
#
# ---------------------------------------------------------------------------
# THE sqtab WINDOW IS INVISIBLE TO ld65 (SPEC §8.1)
# ---------------------------------------------------------------------------
# `sqtab_lo` / `sqtab_hi` — the 1 KB quarter-square multiply tables built at
# boot by `sqtab_init` / `mul_tables_init` — are an absolute EQUATE derived
# from `LIB_SHARED_SQTAB_BASE` (src/sqtab_base.inc, default $9C00), NOT a
# segment. ld65 therefore does not know the window exists and will place a
# segment straight over it with no overlap diagnostic; `sqtab_init` then
# writes 1 KB over whatever landed there. That is a real incident in this
# library's history (2026-05-17, at the then-current $7800 base): the
# multiply table was corrupted at boot and the machine never reached its
# init sentinel.
#
# Two obligations, and NOTHING at link time enforces either:
#
#   1. Reserve the window in your MEMORY map (the SQTAB region below), and
#      keep the region address in lockstep with the -D value by hand.
#   2. If you relocate it, rebuild the library with
#        make lib CONTRACT_DEFINES='-D LIB_SHARED_SQTAB_BASE=0x8800'
#      — `0x` form, never `$`: through make a `$` value silently becomes 0
#      or the shell's PID (SPEC §2). The base must be page-aligned; the
#      library `.assert`s that at assemble time.
#
# You are strongly advised to add the equivalent of the library's own guard
# to your cfg + main: give your code area `define = yes` and
#   .import __MAIN_LAST__
#   .assert __MAIN_LAST__ <= sqtab_lo, lderror, "image grew into the sqtab window"
# turning the silent overwrite into a named link failure. src/main.s does
# exactly this for the library's own PRG; nothing here can do it for yours.
#
# ---------------------------------------------------------------------------
# ZERO PAGE (SPEC §2)
# ---------------------------------------------------------------------------
# The library claims 8–27 bytes of ZP depending on which archive you link
# (`LIB_NISTCURVES_ZP_USAGE_BYTES` reports the figure for the archive you
# have). The slots are `.exportzp`-ed `.ifndef`-guarded equates in
# src/zp_config.s, not a ZEROPAGE segment allocation, so they do not
# consume space in the ZEROPAGE segment below — but you must not use those
# addresses yourself. Relocate them by rebuilding:
#   make lib CONTRACT_ZP_DEFINES='-D fp_src1=0x50 -D fp_src2=0x54'
# `ZEROPAGE` is the one segment name SPEC §4 exempts from the LIB_ prefix.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    # The 2-byte PRG load address. Emit it from your own entry module:
    #     .segment "LOADADDR"
    #     .import  __LOADADDR__
    #     .word    __LOADADDR__
    # The LOADADDR segment below is `optional = yes` so a cartridge or
    # non-PRG target can drop it — but note the area is `fill = yes`, so if
    # you target a PRG and forget the two bytes you get a $0000 load address
    # with no diagnostic.
    __LOADADDR__: type = export, value = %S;
}

MEMORY {
    ZP:       file = "",  start = $0002, size = $00FE, define = yes;
    LOADADDR: file = %O,  start = %S - 2, size = $0002, fill = yes;

    # `define = yes` publishes __MAIN_LAST__ so you can write the
    # sqtab-window assert described in the header comment. It costs
    # nothing (symbols only) and the guard cannot exist without it.
    MAIN:     file = %O,  start = %S,     size = $9C00 - %S, define = yes;

    # The SPEC §8.1 sqtab window, reserved against segment placement.
    # `file = ""` so nothing is emitted here; the 1 KB is written at run
    # time by sqtab_init. Keep `start` equal to LIB_SHARED_SQTAB_BASE.
    SQTAB:    file = "",  start = $9C00,  size = $0400, define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = LOADADDR, type = ro,  optional = yes;

    # Your own code / rodata / data. Any names you like — SPEC §4 reserves
    # only the LIB_NISTCURVES_* prefix.
    CODE:      load = MAIN,     type = rw;
    RODATA:    load = MAIN,     type = ro,  optional = yes;

    # ---- Library code tier -------------------------------------------------
    #
    # REQUIRED type = rw on MUL / P256 / P384 — these code segments are
    # SELF-MODIFIED at run time, and MUL_CODE additionally holds mutable
    # scratch bytes inside the code stream. They must be in writable RAM
    # while executing: do not give them a ROM `load` with a separate RAM
    # `run` unless you copy them, and never mark them `ro` in a cartridge
    # layout that would leave them in ROM. Patch sites, for reference:
    #   MUL_CODE   src/mul_8x8.s:216,218 (`sta smc_lo_addr+2` /
    #              `smc_hi_addr+2` rewrite the sqtab abs,x high bytes on
    #              every ct_mul_8x8 call) and src/mul_8x8.s:199-200/248-249
    #              (poly_prod_lo/hi, ct_diff_raw, ct_sign_mask — RW bytes
    #              living inside a code segment)
    #   P256_CODE  src/fp256.s:206-211 (multiply accumulator addresses)
    #   P384_CODE  src/mod384.s:214-217 (Solinas dispatch `jmp` operand)
    # With the SMC writes discarded, ct_mul_8x8 indexes the wrong sqtab
    # page and the Solinas dispatch jumps to a stale target: wrong field
    # results, no diagnostic.
    #
    # No code segment may be `type = bss`: ld65 warns, then links anyway,
    # having dropped the code from the image and shifted every following
    # byte's load address down by the segment's size.
    #
    # MAIN_CODE / MAIN_RODATA hold src/main.s, which is in NO consumer
    # archive (API.md §8.2). They are declared `optional = yes` so this cfg
    # also links the library's own objects if you ever do that; a pure
    # archive consumer never places bytes there.
    LIB_NISTCURVES_MAIN_CODE:       load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_MUL_CODE:        load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_CODE:       load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_CODE:       load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_SHA384_CODE:     load = MAIN, type = rw, optional = yes;

    # ---- Library rodata tier -----------------------------------------------
    # Curve parameters, moduli, the SHA-384 K[80] round constants. No
    # placement requirement beyond being file-emitting; `ro` and `rw` link
    # identically. `bss` would drop the constants from the image (ld65 warns
    # here, because the content is non-zero) and every curve op would read
    # power-on garbage as its modulus.
    LIB_NISTCURVES_MAIN_RODATA:     load = MAIN, type = ro, optional = yes;
    LIB_NISTCURVES_P256_RODATA:     load = MAIN, type = ro, optional = yes;
    LIB_NISTCURVES_P384_RODATA:     load = MAIN, type = ro, optional = yes;
    LIB_NISTCURVES_SHA384_RODATA:   load = MAIN, type = ro, optional = yes;

    # ---- Library page-aligned tables tier ----------------------------------

    # REQUIRED align = $100 — TIMING invariant. Holds the twelve 256-byte
    # SHA-384 within-byte rotate LUTs (lo_2_tbl..hi_7_tbl, src/sha384.s:962+),
    # read as `lda lo_k_tbl,x` / `ora hi_k_tbl,x` over the full 8-bit index
    # range. The LUTs are exactly 256 B each and contiguous, so page-aligning
    # the segment page-aligns all twelve; misaligning it by d makes every
    # index >= 256-d cross a page and cost an extra cycle, so compression
    # time depends on the bytes being hashed. Correctness is unaffected.
    # It is not constant-time-critical for THIS library (SHA-384 is used
    # only on the ECDSA verify path, over public message bytes), but a
    # consumer hashing secret input — HMAC, a TLS key schedule — depends on
    # this alignment for timing stability. `type = ro` is NOT load-bearing;
    # `bss` would drop 3 KB of LUT from the image.
    LIB_NISTCURVES_SHA384_TABLES:   load = MAIN, type = ro, align = $100, optional = yes;

    # REQUIRED align = $100 — HOT-LOOP timing. Holds nistcurves_mul_dma_lo /
    # nistcurves_mul_dma_hi (src/data_shared.s:44-50), the two 256-byte REU
    # DMA landing pages for the multiply-table row fetch, read as
    # `adc nistcurves_mul_dma_lo,y` / `..._hi,y` over the full 8-bit index
    # range in the 4x-unrolled inner loops — the single hottest code in the
    # library, ~1024 indexed reads per fp_mul. Misalignment costs a
    # page-cross cycle on the straddling indices, i.e. a few percent of
    # field-multiply time that also varies with the operand bytes. (This is
    # NOT what makes fp_mul constant-time — it is not: the inner loop has a
    # documented secret-dependent `beq` zero-byte skip and the row fetch is
    # operand-addressed. Do not read this as a CT claim.)
    #
    # The DMA is one 512-byte transfer based at nistcurves_mul_dma_lo, so it
    # spans BOTH pages: the two buffers must stay contiguous, which placing
    # them in this one segment guarantees. Do not split them.
    #
    # REQUIRED type = rw — specifically, never `bss`. The 512 bytes are
    # zero-initialised, so ld65 V2.18 drops them under `bss` with NO
    # diagnostic whatsoever: the image loses 512 bytes and every segment
    # placed after this one loads 512 bytes below its link address.
    LIB_NISTCURVES_TABLES:          load = MAIN, type = rw, align = $100, optional = yes;

    # ---- Library RW state tier ---------------------------------------------
    # Per-curve / per-feature BSS split so the minimal archives can exclude
    # buffers their use case does not touch. `optional = yes` is required —
    # the minimal archives omit whole data_* objects, and its absence fails
    # loudly ("Segment not found").
    #
    # No alignment requirement anywhere in this tier, and the emitted
    # contents are not load-bearing: every buffer is zero-filled `.res` and
    # is written before it is read. What DOES matter is that they stay
    # file-emitting AND stay after everything above. Because they are
    # zero-filled, flipping any of them to `bss` is completely silent on
    # ld65 V2.18, and a `bss` segment sitting ahead of any file-emitting
    # segment shortens the image and shifts everything after it down by its
    # own size. Keep them all `rw`, declared last.
    LIB_NISTCURVES_BSS:             load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_BSS:        load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_INVREF_BSS: load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_LIMLEE_BSS: load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_BSS:        load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_DATA_BSS:   load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_LIMLEE_BSS: load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_SHA384_BSS:      load = MAIN, type = rw, optional = yes;

    # Test-harness scratch (src/data_test.s). In NO consumer archive;
    # declared so this cfg also links the library's own object set.
    LIB_NISTCURVES_TEST_BSS:        load = MAIN, type = rw, optional = yes;

    # Your own BSS, and the reserved sqtab window. Both go last: they emit
    # no file bytes, so nothing file-backed may be declared after them.
    BSS:       load = MAIN,  type = bss, optional = yes, define = yes;
    SQTAB:     load = SQTAB, type = bss, optional = yes, define = yes;
}
