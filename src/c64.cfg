# ld65 linker configuration for C64 PRG loading at $0801
# Produces identical output to the ACME -f cbm build
#
# Segment naming follows c64-lib-contract SPEC §4: every library code/rodata/
# data/bss segment is prefixed `LIB_NISTCURVES_*` with per-variant splits
# (P256 / P384 / SHA384 / MUL / MAIN). Consumer projects that vendor this
# library as a git submodule pick up the bytes by segment name from their
# own cfg's SEGMENTS{} block — zero source patches at integration.
#
# Standalone PRG build (this file) aliases every prefixed segment back to
# the single MAIN memory region so the library's own test PRG layout is
# preserved. The placement order below is chosen to keep the resulting
# nist-curves.prg byte-close to the pre-rename baseline: code segments in
# Makefile module link order, then RODATA, then page-aligned TABLES, then
# RW state.
#
# LOAD-BEARING CFG ATTRIBUTES (SPEC §4). Consumers write their own
# SEGMENTS{} block, so every placement attribute this library's correctness
# or timing depends on is declared inline below, with the consequence of
# getting it wrong. A clean link is NOT evidence: measured on ld65 V2.18,
# dropping `align = $100` from a segment produces no diagnostic at all
# (nothing in src/*.s uses `.align`, so ld65 has no source-side alignment
# request to warn about — the alignment exists only here), and switching a
# zero-initialised `rw` segment to `bss` also produces no diagnostic. Only
# `bss` on a segment holding non-zero bytes warns
# ("… with type 'bss' contains initialized data") — and still links.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__: type = export, value = %S;
}

MEMORY {
    ZP:     file = "", start = $0002, size = $00FE, type = rw, define = yes;
    HEADER: file = %O, start = %S - 2, size = $0002, fill = yes;

    # RESERVE $9C00..$9FFF against segment placement. That 1 KB window is
    # `sqtab_lo` / `sqtab_hi`, the SPEC §8.1 quarter-square tables. They are
    # an absolute equate (LIB_SHARED_SQTAB_BASE, src/mul_8x8.s:42-48), NOT a
    # segment, so ld65 does not know they exist and will happily place a
    # segment on top of them — silently, with no overlap diagnostic. The
    # symptom is a corrupted multiply table and a boot that never reaches the
    # $02A7 sentinel (this exact collision happened on 2026-05-17 at the
    # previous $7800 base; see CLAUDE.md "Known issues"). MAIN below spans
    # $0801..$CFFF and therefore *includes* the window: as of this commit
    # __MAIN_LAST__ is $9A67, i.e. 409 bytes of slack.
    #
    # REQUIRED define = yes — publishes __MAIN_START__ / __MAIN_LAST__ /
    # __MAIN_SIZE__. src/main.s imports __MAIN_LAST__ and asserts, with
    # `lderror`, that the placed image ends at or below sqtab_lo, which
    # converts this silent overwrite into a named link failure. Drop
    # `define = yes` and that TU stops linking (unresolved external), so the
    # guard cannot rot quietly. Measured: 409 bytes of added BSS still link,
    # 410 trip the assert. Byte-identical PRG either way — `define = yes`
    # only publishes symbols.
    #
    # The guard covers THIS PRG only. Consumers author their own memory map,
    # so nothing here can assert against it: they must either keep their
    # image below $9C00 or override LIB_SHARED_SQTAB_BASE (page-aligned) to
    # somewhere they have actually reserved, and are advised to add the
    # equivalent `lderror` assert against their own area's __*_LAST__.
    MAIN:   file = %O, start = %S, size = $D000 - %S, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    LOADADDR: load = HEADER, type = ro;

    # --- Code tier (Makefile module link order) ---
    # REQUIRED type = rw on MUL / P256 / P384 — these code segments are
    # SELF-MODIFIED at run time and MUL_CODE additionally holds mutable
    # scratch bytes inside the code stream. They must be in writable RAM
    # while executing; do not give them a ROM `load` with a separate RAM
    # `run` unless you copy them, and never mark them `ro` in a cartridge
    # layout that would leave them in ROM. Patch sites, for reference:
    #   MUL_CODE   src/mul_8x8.s:216,218 (`sta smc_lo_addr+2` / `smc_hi_addr+2`
    #              rewrite the sqtab abs,x high bytes on every ct_mul_8x8 call)
    #              and src/mul_8x8.s:199-200 / 248-249 (poly_prod_lo/hi,
    #              ct_diff_raw, ct_sign_mask — RW bytes in a code segment)
    #   P256_CODE  src/fp256.s:206-211 (multiply accumulator addresses)
    #   P384_CODE  src/mod384.s:214-217 (Solinas dispatch `jmp` operand)
    # With the SMC writes discarded, ct_mul_8x8 indexes the wrong sqtab page
    # and the Solinas dispatch jumps to a stale target: wrong field results,
    # no diagnostic.
    #
    # No code segment may be `type = bss` (ld65 warns, then links anyway,
    # having dropped the code from the image and shifted every following
    # byte's load address down by the segment's size).
    LIB_NISTCURVES_MAIN_CODE:     load = MAIN, type = rw;
    LIB_NISTCURVES_MUL_CODE:      load = MAIN, type = rw;
    LIB_NISTCURVES_P256_CODE:     load = MAIN, type = rw;
    LIB_NISTCURVES_P384_CODE:     load = MAIN, type = rw;
    LIB_NISTCURVES_SHA384_CODE:   load = MAIN, type = rw;

    # --- RODATA tier ---
    LIB_NISTCURVES_MAIN_RODATA:   load = MAIN, type = ro;
    LIB_NISTCURVES_P256_RODATA:   load = MAIN, type = ro;
    LIB_NISTCURVES_P384_RODATA:   load = MAIN, type = ro;
    LIB_NISTCURVES_SHA384_RODATA: load = MAIN, type = ro;

    # --- Page-aligned tables tier ---

    # REQUIRED align = $100 — timing invariant. Holds the twelve 256-byte
    # SHA-384 within-byte rotate LUTs (lo_2_tbl .. hi_7_tbl, src/sha384.s:962+),
    # read as `lda lo_k_tbl,x` / `ora hi_k_tbl,x` over the full 8-bit index
    # range (src/sha384.s:738,740,754,756,760, instantiated at :796-833). The
    # LUTs are exactly 256 B each and contiguous, so page-aligning the segment
    # page-aligns all twelve; misaligning it by d makes every index >= 256-d
    # cross a page and cost an extra cycle, so compression time depends on the
    # bytes being hashed. Correctness is unaffected — this is a timing
    # requirement, not a functional one. It is not constant-time-critical for
    # THIS library (SHA-384 is used only on the ECDSA verify path, over public
    # message bytes), but a consumer that hashes secret input — HMAC, a TLS
    # key schedule — depends on this alignment for timing stability.
    # `type = ro` is NOT load-bearing: rw links identically. `bss` would drop
    # 3 KB of LUT from the image (ld65 warns here, because the content is
    # non-zero).
    LIB_NISTCURVES_SHA384_TABLES: load = MAIN, type = ro,  align = $100;

    # REQUIRED align = $100 — hot-loop timing. Holds mul_dma_lo / mul_dma_hi
    # (src/data_shared.s:44-50), the two 256-byte REU DMA landing pages for
    # the multiply-table row fetch, read as `adc mul_dma_lo,y` /
    # `adc mul_dma_hi,y` over the full 8-bit index range in the 4x-unrolled
    # inner loops (src/fp256.s:255-311,517-573,700-702; src/fp384.s:298-357,
    # 584-643,775-777) — the single hottest code in the library, ~1024 index
    # reads per fp_mul. Misalignment costs a page-cross cycle on the indices
    # that straddle, i.e. a few percent of field-multiply time that also
    # varies with the operand bytes. Note this is NOT what makes fp_mul
    # constant-time — it is not: the inner loop has a documented
    # secret-dependent `beq` zero-byte skip and the row fetch itself is
    # operand-addressed. Do not read this declaration as a CT claim.
    # The DMA is one 512-byte transfer based at mul_dma_lo (base programmed
    # once at src/reu_mul_init.s:107-109), so it spans BOTH pages: the two
    # buffers must stay contiguous, which placing them in this one segment
    # guarantees. Do not split them.
    #
    # REQUIRED type = rw — specifically, never `bss`. The 512 bytes are
    # zero-initialised, and ld65 V2.18 therefore drops them under `bss` with
    # NO diagnostic whatsoever: the image loses 512 bytes and every segment
    # placed after this one loads 512 bytes below its link address.
    LIB_NISTCURVES_TABLES:        load = MAIN, type = rw,  align = $100;

    # --- RW state tier ---
    # Per-curve / per-feature BSS split (issue #40 / SPEC §6) lets minimal-
    # archive build targets exclude buffers their use case doesn't touch.
    # LIB_NISTCURVES_BSS is now the shared multiply scratch only
    # (mul_cached_a, mul_src2_buf); curve / SHA / test buffers each live
    # in their own segment. Placement order below matches the Makefile
    # MODULES link order for the data_* files so the standalone PRG stays
    # close to its pre-split byte layout.
    #
    # No alignment requirement anywhere in this tier. Contents are not
    # load-bearing either: every buffer is zero-filled `.res` and is written
    # before it is read (e.g. the mul_src2_buf over-read pad at
    # src/data_shared.s:38 is re-zeroed at run time by src/fp256.s:429-432,
    # and its P-384 twin by src/fp384.s:488-491), so no consumer depends on
    # the emitted zeros. The one thing that DOES matter is ordering: because
    # these segments are zero-filled, flipping any of them to `bss` is
    # completely silent on ld65 V2.18, and a `bss` segment sitting ahead of
    # any file-emitting segment shortens the image and shifts everything
    # after it down by its own size. `optional = yes` is required by the
    # SPEC §6 minimal-archive targets, which omit whole data_* objects; its
    # absence fails loudly ("Segment not found"), so it needs no declaration.
    #
    # KNOWN DEVIATION: LIB_NISTCURVES_P384_BSS below is `type = bss` while
    # all its siblings are `rw`, and it sits ahead of four file-emitting
    # segments — so this PRG is 53 bytes shorter than its address span and
    # everything after $83C6 loads 53 bytes low. Benign today only because
    # all following content is zeros and every one of those buffers is
    # written before read. Do not copy the `bss` here into a consumer cfg.
    LIB_NISTCURVES_BSS:                load = MAIN, type = rw;
    LIB_NISTCURVES_P256_BSS:           load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_INVREF_BSS:    load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P256_LIMLEE_BSS:    load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_BSS:           load = MAIN, type = bss, optional = yes;
    LIB_NISTCURVES_P384_DATA_BSS:      load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_P384_LIMLEE_BSS:    load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_SHA384_BSS:         load = MAIN, type = rw, optional = yes;
    LIB_NISTCURVES_TEST_BSS:           load = MAIN, type = rw, optional = yes;
}
